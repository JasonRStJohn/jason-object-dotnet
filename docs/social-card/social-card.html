<html><head><meta charset="utf-8"><title>JasonObject social card</title>
<style>
@font-face { font-family: "Archivo"; src: url("../../src/MeDotNet/wwwroot/fonts/archivo-var-latin.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
@font-face { font-family: "Martian Mono"; src: url("../../src/MeDotNet/wwwroot/fonts/martian-mono-var-latin.woff2") format("woff2"); font-weight: 100 800; font-stretch: 75% 112.5%; }
* { box-sizing: border-box; margin: 0; }
body { width: 1200px; height: 630px; overflow: hidden; position: relative; background: #0B1220; font-family: "Archivo", sans-serif; color: #E6EDF7; }
.grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(96,165,250,.11) 1px, transparent 1px), linear-gradient(90deg, rgba(96,165,250,.11) 1px, transparent 1px); background-size: 44px 44px; }
.frame { position: absolute; inset: 22px; border: 1.5px solid #22304A; border-radius: 22px; }
.copy { position: absolute; left: 68px; top: 70px; width: 640px; }
.name { font-weight: 800; font-size: 26px; letter-spacing: .01em; }
.roles { margin-top: 8px; display: flex; gap: 22px; font-size: 18px; color: #9AABC4; }
.roles span { display: inline-flex; align-items: center; gap: 9px; }
h1 { margin-top: 40px; font-size: 66px; line-height: 1.0; font-weight: 850; font-stretch: 114%; letter-spacing: -.015em; text-transform: uppercase; }
.sub { margin-top: 22px; font-size: 24px; line-height: 1.4; color: #9AABC4; }
.url { position: absolute; left: 68px; bottom: 62px; display: flex; gap: 14px; align-items: center; }
.tag { font-family: "Martian Mono", monospace; font-size: 15px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #FBBF24; border: 1.5px solid rgba(251,191,36,.7); background: rgba(251,191,36,.1); border-radius: 999px; padding: 9px 16px; }
.tag.cyan { color: #22D3EE; border-color: rgba(34,211,238,.7); background: rgba(34,211,238,.08); }
.photo { position: absolute; right: 64px; top: 58px; width: 360px; height: 514px; border-radius: 18px; border: 2px solid rgba(251,191,36,.75); overflow: hidden; background: #0F1A2E; }
.photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 12%; }
.ship { position: absolute; }
</style></head>
<body>
<div class="grid"></div>
<div class="frame"></div>

<svg class="ship" style="left:618px;top:540px;transform:rotate(62deg)" width="44" height="64" viewBox="-14 -24 28 48" opacity=".85"><polygon points="-4,10 4,10 0,20" fill="#ef4444"/><polygon points="-10,10 10,10 0,-20" fill="#888e99"/><polygon points="-10,10 10,10 0,3" fill="#3b82f6"/></svg>
<svg class="ship" style="left:560px;top:30px;transform:rotate(-118deg)" width="36" height="52" viewBox="-14 -24 28 48" opacity=".7"><polygon points="-4,10 4,10 0,20" fill="#ef4444"/><polygon points="-10,10 10,10 0,-20" fill="#888e99"/><polygon points="-10,10 10,10 0,3" fill="#10b981"/></svg>

<div class="copy">
  <div class="name">Jason R. St. John</div>
  <div class="roles">
    <span><svg width="15" height="11" viewBox="-12 -11 34 22"><polygon points="-10,-10 -10,10 20,0" fill="#888e99"/><polygon points="-10,-10 -10,10 -3,0" fill="#3b82f6"/></svg>Lead Software Architect</span>
    <span><svg width="15" height="11" viewBox="-12 -11 34 22"><polygon points="-10,-10 -10,10 20,0" fill="#888e99"/><polygon points="-10,-10 -10,10 -3,0" fill="#facc15"/></svg>Full-Stack Engineer</span>
